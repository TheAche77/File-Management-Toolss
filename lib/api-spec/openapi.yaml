openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Local business discovery engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Category operations
  - name: businesses
    description: Business operations
  - name: imports
    description: Import operations
  - name: export
    description: Export operations
  - name: stats
    description: Statistics operations
  - name: outreach
    description: Outreach operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /businesses:
    get:
      operationId: getBusinesses
      tags: [businesses]
      summary: List businesses with filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
        - name: hasWebsite
          in: query
          schema:
            type: boolean
        - name: hasPhone
          in: query
          schema:
            type: boolean
        - name: readyForOutreach
          in: query
          schema:
            type: boolean
        - name: reviewRequired
          in: query
          schema:
            type: boolean
        - name: minPriorityScore
          in: query
          schema:
            type: integer
        - name: minResearchScore
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessesResponse"

  /businesses/review-queue:
    get:
      operationId: getReviewQueue
      tags: [businesses]
      summary: List businesses that should be manually reviewed next
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Prioritized review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewQueueItem"

  /businesses/{id}:
    get:
      operationId: getBusinessById
      tags: [businesses]
      summary: Get a business by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/outreach:
    get:
      operationId: getBusinessOutreach
      tags: [businesses]
      summary: Get protected outreach fields for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outreach details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessOutreach"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBusinessOutreach
      tags: [businesses]
      summary: Update protected outreach fields for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessOutreachRequest"
      responses:
        "200":
          description: Updated outreach details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessOutreach"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/sources:
    get:
      operationId: getBusinessSources
      tags: [businesses]
      summary: List tracked sources for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sources for one business
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessSource"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/contact-candidates:
    get:
      operationId: getBusinessContactCandidates
      tags: [businesses]
      summary: List contact candidates derived for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact candidates for one business
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactCandidate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/outreach-events:
    get:
      operationId: getBusinessOutreachEvents
      tags: [businesses]
      summary: List outreach audit events for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outreach audit event timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBusinessContactCandidate
      tags: [businesses]
      summary: Update review state or primary flag for one contact candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: candidateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCandidateUpdateRequest"
      responses:
        "200":
          description: Updated contact candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCandidate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Dashboard statistics
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

  /outreach/dashboard:
    get:
      operationId: getOutreachDashboard
      tags: [outreach]
      summary: Outreach KPI dashboard metrics
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Outreach dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachDashboardResponse"

  /outreach/pipeline:
    get:
      operationId: getOutreachPipeline
      tags: [outreach]
      summary: Follow-up board items and urgency buckets
      parameters:
        - name: horizonDays
          in: query
          schema:
            type: integer
            default: 7
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Outreach pipeline board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachPipelineResponse"

  /imports/run:
    post:
      operationId: runImport
      tags: [imports]
      summary: Queue an import for a category + city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Import failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /imports/runs:
    get:
      operationId: getImportRuns
      tags: [imports]
      summary: List import run history
      responses:
        "200":
          description: Import runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportRun"

  /imports/runs/{id}:
    get:
      operationId: getImportRunById
      tags: [imports]
      summary: Get detailed status for one import run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /export/businesses.csv:
    get:
      operationId: exportBusinessesCsv
      tags: [export]
      summary: Export businesses as CSV
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
        - name: readyForOutreach
          in: query
          schema:
            type: boolean
        - name: reviewRequired
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Category:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        label:
          type: string
        description:
          type: ["string", "null"]
        osmTags:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
      required: [id, slug, label, osmTags, active, createdAt]

    Business:
      type: object
      properties:
        id:
          type: integer
        categorySlug:
          type: string
        name:
          type: string
        slug:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        addressLine:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        osmId:
          type: ["string", "null"]
        osmType:
          type: ["string", "null"]
        googlePlaceId:
          type: ["string", "null"]
        googleMapsUrl:
          type: ["string", "null"]
        rating:
          type: ["string", "null"]
        userRatingsTotal:
          type: ["integer", "null"]
        hasWebsite:
          type: boolean
        hasPhone:
          type: boolean
        enrichmentStatus:
          type: string
        targetMarket:
          type: ["string", "null"]
        discoveryStatus:
          type: ["string", "null"]
        qualificationStatus:
          type: ["string", "null"]
        contactabilityStatus:
          type: ["string", "null"]
        rankingStatus:
          type: ["string", "null"]
        sourceHealth:
          type: ["string", "null"]
        contactReadiness:
          type: ["string", "null"]
        relevanceScore:
          type: ["integer", "null"]
        contactabilityScore:
          type: ["integer", "null"]
        confidenceScore:
          type: ["integer", "null"]
        freshnessScore:
          type: ["integer", "null"]
        priorityScore:
          type: ["integer", "null"]
        researchScore:
          type: ["integer", "null"]
        officialSourceCount:
          type: ["integer", "null"]
        successfulSourceCount:
          type: ["integer", "null"]
        failedSourceCount:
          type: ["integer", "null"]
        primarySourceId:
          type: ["integer", "null"]
        primaryContactCandidateId:
          type: ["integer", "null"]
        readyForOutreach:
          type: boolean
        reviewRequired:
          type: boolean
        reviewReason:
          type: ["string", "null"]
        topGap:
          type: ["string", "null"]
        recommendedNextStep:
          type: ["string", "null"]
        lastResearchAt:
          type: ["string", "null"]
        nextResearchAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - categorySlug
        - name
        - slug
        - latitude
        - longitude
        - hasWebsite
        - hasPhone
        - enrichmentStatus
        - readyForOutreach
        - reviewRequired
        - createdAt
        - updatedAt

    BusinessesResponse:
      type: object
      properties:
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/Business"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
      required: [businesses, total, page, pageSize, totalPages]

    BusinessSource:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        sourceType:
          type: string
        sourceUrl:
          type: string
        sourceDomain:
          type: ["string", "null"]
        discoveredVia:
          type: ["string", "null"]
        fetchStatus:
          type: string
        lastFetchedAt:
          type: ["string", "null"]
        contentHash:
          type: ["string", "null"]
        httpStatus:
          type: ["integer", "null"]
        isOfficial:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - businessId
        - sourceType
        - sourceUrl
        - fetchStatus
        - isOfficial
        - createdAt
        - updatedAt

    ReviewQueueItem:
      type: object
      properties:
        business:
          $ref: "#/components/schemas/Business"
        reasons:
          type: array
          items:
            type: string
        priorityScore:
          type: integer
        sourceCount:
          type: integer
        officialSourceCount:
          type: integer
        failedSourceCount:
          type: integer
      required:
        - business
        - reasons
        - priorityScore
        - sourceCount
        - officialSourceCount
        - failedSourceCount

    BusinessOutreach:
      type: object
      properties:
        businessId:
          type: integer
        outreachStatus:
          type: string
        contactName:
          type: ["string", "null"]
        contactRole:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        lastContactDate:
          type: ["string", "null"]
        nextActionDate:
          type: ["string", "null"]
        assignedArtist:
          type: ["string", "null"]
        assignedArtistSource:
          type: ["string", "null"]
        avatarType:
          type: ["string", "null"]
        targetMarket:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        warmConnection:
          type: ["string", "null"]
        readyForOutreach:
          type: boolean
        reviewRequired:
          type: boolean
        reviewReason:
          type: ["string", "null"]
        priorityScore:
          type: ["integer", "null"]
        updatedAt:
          type: string
      required:
        - businessId
        - outreachStatus
        - readyForOutreach
        - reviewRequired
        - updatedAt

    UpdateBusinessOutreachRequest:
      type: object
      properties:
        outreachStatus:
          type: string
        contactName:
          type: ["string", "null"]
        contactRole:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        lastContactDate:
          type: ["string", "null"]
        nextActionDate:
          type: ["string", "null"]
        assignedArtist:
          type: ["string", "null"]
        assignedArtistSource:
          type: ["string", "null"]
        avatarType:
          type: ["string", "null"]
        targetMarket:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        warmConnection:
          type: ["string", "null"]

    ContactCandidate:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        fullName:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        contactType:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        contactUrl:
          type: ["string", "null"]
        sourceUrl:
          type: string
        sourceType:
          type: string
        confidenceScore:
          type: string
        isPrimary:
          type: boolean
        isPersonalData:
          type: boolean
        lastVerifiedAt:
          type: ["string", "null"]
        reviewStatus:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - businessId
        - contactType
        - sourceUrl
        - sourceType
        - confidenceScore
        - isPrimary
        - isPersonalData
        - reviewStatus
        - createdAt
        - updatedAt

    OutreachEvent:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        eventType:
          type: string
        entityType:
          type: string
        entityId:
          type: ["integer", "null"]
        actorType:
          type: string
        summary:
          type: string
        changedFields:
          type: array
          items:
            type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
      required:
        - id
        - businessId
        - eventType
        - entityType
        - actorType
        - summary
        - changedFields
        - payload
        - createdAt

    ContactCandidateUpdateRequest:
      type: object
      properties:
        reviewStatus:
          type: string
        isPrimary:
          type: boolean

    StatsResponse:
      type: object
      properties:
        totalBusinesses:
          type: integer
        withWebsite:
          type: integer
        withPhone:
          type: integer
        enriched:
          type: integer
        byCategoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        byCityBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CityCount"
      required:
        - totalBusinesses
        - withWebsite
        - withPhone
        - enriched
        - byCategoryBreakdown
        - byCityBreakdown

    OutreachPipelineItem:
      type: object
      properties:
        businessId:
          type: integer
        businessName:
          type: string
        city:
          type: ["string", "null"]
        categorySlug:
          type: string
        website:
          type: ["string", "null"]
        outreachStatus:
          type: string
        nextActionDate:
          type: ["string", "null"]
        lastContactDate:
          type: ["string", "null"]
        assignedArtist:
          type: ["string", "null"]
        assignedArtistSource:
          type: ["string", "null"]
        avatarType:
          type: ["string", "null"]
        targetMarket:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactRole:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        warmConnection:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        readyForOutreach:
          type: boolean
        reviewRequired:
          type: boolean
        priorityScore:
          type: ["integer", "null"]
        reviewReason:
          type: ["string", "null"]
        urgencyBucket:
          type: string
        daysUntilAction:
          type: ["integer", "null"]
        recommendedAction:
          type: string
        updatedAt:
          type: string
      required:
        - businessId
        - businessName
        - categorySlug
        - outreachStatus
        - readyForOutreach
        - reviewRequired
        - urgencyBucket
        - recommendedAction
        - updatedAt

    OutreachPipelineSummary:
      type: object
      properties:
        urgent:
          type: integer
        thisWeek:
          type: integer
        next:
          type: integer
      required: [urgent, thisWeek, next]

    OutreachPipelineResponse:
      type: object
      properties:
        today:
          type: string
        horizonDays:
          type: integer
        total:
          type: integer
        summary:
          $ref: "#/components/schemas/OutreachPipelineSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OutreachPipelineItem"
      required: [today, horizonDays, total, summary, items]

    OutreachDashboardResponse:
      type: object
      properties:
        totalTargets:
          type: integer
        contacted:
          type: integer
        positiveResponses:
          type: integer
        responseRate:
          type: number
        overdueFollowUps:
          type: integer
        inProgress:
          type: integer
        interested:
          type: integer
        urgentThisWeek:
          type: array
          items:
            $ref: "#/components/schemas/OutreachPipelineItem"
      required:
        - totalTargets
        - contacted
        - positiveResponses
        - responseRate
        - overdueFollowUps
        - inProgress
        - interested
        - urgentThisWeek

    CategoryCount:
      type: object
      properties:
        categorySlug:
          type: string
        count:
          type: integer
      required: [categorySlug, count]

    CityCount:
      type: object
      properties:
        city:
          type: ["string", "null"]
        count:
          type: integer
      required: [city, count]

    ImportRequest:
      type: object
      properties:
        categorySlug:
          type: string
        city:
          type: string
      required: [categorySlug, city]

    ImportResult:
      type: object
      properties:
        success:
          type: boolean
        queued:
          type: boolean
        status:
          type: string
        fetched:
          type: integer
        inserted:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        message:
          type: string
        runId:
          type: ["integer", "null"]
      required: [success, queued, status, fetched, inserted, updated, skipped, errors, message]

    ImportRun:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
        categorySlug:
          type: string
        city:
          type: string
        status:
          type: string
        fetched:
          type: ["integer", "null"]
        inserted:
          type: ["integer", "null"]
        updated:
          type: ["integer", "null"]
        skipped:
          type: ["integer", "null"]
        errors:
          type: ["integer", "null"]
        errorMessage:
          type: ["string", "null"]
        startedAt:
          type: string
        finishedAt:
          type: ["string", "null"]
      required: [id, source, categorySlug, city, status, startedAt]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
