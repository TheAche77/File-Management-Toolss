openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Local business discovery engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Category operations
  - name: businesses
    description: Business operations
  - name: imports
    description: Import operations
  - name: export
    description: Export operations
  - name: stats
    description: Statistics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /businesses:
    get:
      operationId: getBusinesses
      tags: [businesses]
      summary: List businesses with filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: hasWebsite
          in: query
          schema:
            type: boolean
        - name: hasPhone
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessesResponse"

  /businesses/review-queue:
    get:
      operationId: getReviewQueue
      tags: [businesses]
      summary: List businesses that should be manually reviewed next
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Prioritized review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewQueueItem"

  /businesses/{id}:
    get:
      operationId: getBusinessById
      tags: [businesses]
      summary: Get a business by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/sources:
    get:
      operationId: getBusinessSources
      tags: [businesses]
      summary: List tracked sources for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sources for one business
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessSource"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/contact-candidates:
    get:
      operationId: getBusinessContactCandidates
      tags: [businesses]
      summary: List contact candidates derived for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact candidates for one business
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactCandidate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBusinessContactCandidate
      tags: [businesses]
      summary: Update review state or primary flag for one contact candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: candidateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCandidateUpdateRequest"
      responses:
        "200":
          description: Updated contact candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCandidate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Dashboard statistics
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

  /imports/run:
    post:
      operationId: runImport
      tags: [imports]
      summary: Queue an import for a category + city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Import failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /imports/runs:
    get:
      operationId: getImportRuns
      tags: [imports]
      summary: List import run history
      responses:
        "200":
          description: Import runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportRun"

  /imports/runs/{id}:
    get:
      operationId: getImportRunById
      tags: [imports]
      summary: Get detailed status for one import run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /export/businesses.csv:
    get:
      operationId: exportBusinessesCsv
      tags: [export]
      summary: Export businesses as CSV
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Category:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        label:
          type: string
        description:
          type: ["string", "null"]
        osmTags:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
      required: [id, slug, label, osmTags, active, createdAt]

    Business:
      type: object
      properties:
        id:
          type: integer
        categorySlug:
          type: string
        name:
          type: string
        slug:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        addressLine:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        osmId:
          type: ["string", "null"]
        osmType:
          type: ["string", "null"]
        googlePlaceId:
          type: ["string", "null"]
        googleMapsUrl:
          type: ["string", "null"]
        rating:
          type: ["string", "null"]
        userRatingsTotal:
          type: ["integer", "null"]
        hasWebsite:
          type: boolean
        hasPhone:
          type: boolean
        enrichmentStatus:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - categorySlug
        - name
        - slug
        - latitude
        - longitude
        - hasWebsite
        - hasPhone
        - enrichmentStatus
        - createdAt
        - updatedAt

    BusinessesResponse:
      type: object
      properties:
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/Business"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
      required: [businesses, total, page, pageSize, totalPages]

    BusinessSource:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        sourceType:
          type: string
        sourceUrl:
          type: string
        sourceDomain:
          type: ["string", "null"]
        discoveredVia:
          type: ["string", "null"]
        fetchStatus:
          type: string
        lastFetchedAt:
          type: ["string", "null"]
        contentHash:
          type: ["string", "null"]
        httpStatus:
          type: ["integer", "null"]
        isOfficial:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - businessId
        - sourceType
        - sourceUrl
        - fetchStatus
        - isOfficial
        - createdAt
        - updatedAt

    ReviewQueueItem:
      type: object
      properties:
        business:
          $ref: "#/components/schemas/Business"
        reasons:
          type: array
          items:
            type: string
        priorityScore:
          type: integer
        sourceCount:
          type: integer
        officialSourceCount:
          type: integer
        failedSourceCount:
          type: integer
      required:
        - business
        - reasons
        - priorityScore
        - sourceCount
        - officialSourceCount
        - failedSourceCount

    ContactCandidate:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        fullName:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        contactType:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        contactUrl:
          type: ["string", "null"]
        sourceUrl:
          type: string
        sourceType:
          type: string
        confidenceScore:
          type: string
        isPrimary:
          type: boolean
        isPersonalData:
          type: boolean
        lastVerifiedAt:
          type: ["string", "null"]
        reviewStatus:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - businessId
        - contactType
        - sourceUrl
        - sourceType
        - confidenceScore
        - isPrimary
        - isPersonalData
        - reviewStatus
        - createdAt
        - updatedAt

    ContactCandidateUpdateRequest:
      type: object
      properties:
        reviewStatus:
          type: string
        isPrimary:
          type: boolean

    StatsResponse:
      type: object
      properties:
        totalBusinesses:
          type: integer
        withWebsite:
          type: integer
        withPhone:
          type: integer
        enriched:
          type: integer
        byCategoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        byCityBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CityCount"
      required:
        - totalBusinesses
        - withWebsite
        - withPhone
        - enriched
        - byCategoryBreakdown
        - byCityBreakdown

    CategoryCount:
      type: object
      properties:
        categorySlug:
          type: string
        count:
          type: integer
      required: [categorySlug, count]

    CityCount:
      type: object
      properties:
        city:
          type: ["string", "null"]
        count:
          type: integer
      required: [city, count]

    ImportRequest:
      type: object
      properties:
        categorySlug:
          type: string
        city:
          type: string
      required: [categorySlug, city]

    ImportResult:
      type: object
      properties:
        success:
          type: boolean
        queued:
          type: boolean
        status:
          type: string
        fetched:
          type: integer
        inserted:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        message:
          type: string
        runId:
          type: ["integer", "null"]
      required: [success, queued, status, fetched, inserted, updated, skipped, errors, message]

    ImportRun:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
        categorySlug:
          type: string
        city:
          type: string
        status:
          type: string
        fetched:
          type: ["integer", "null"]
        inserted:
          type: ["integer", "null"]
        updated:
          type: ["integer", "null"]
        skipped:
          type: ["integer", "null"]
        errors:
          type: ["integer", "null"]
        errorMessage:
          type: ["string", "null"]
        startedAt:
          type: string
        finishedAt:
          type: ["string", "null"]
      required: [id, source, categorySlug, city, status, startedAt]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
