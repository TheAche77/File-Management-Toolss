openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Local business discovery engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Category operations
  - name: businesses
    description: Business operations
  - name: imports
    description: Import operations
  - name: export
    description: Export operations
  - name: stats
    description: Statistics operations
  - name: outreach
    description: Outreach operations
  - name: research
    description: Research operations
  - name: slg
    description: Street Levels Gallery strategic operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /businesses:
    get:
      operationId: getBusinesses
      tags: [businesses]
      summary: List businesses with filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
        - name: hasWebsite
          in: query
          schema:
            type: boolean
        - name: hasPhone
          in: query
          schema:
            type: boolean
        - name: readyForOutreach
          in: query
          schema:
            type: boolean
        - name: reviewRequired
          in: query
          schema:
            type: boolean
        - name: minPriorityScore
          in: query
          schema:
            type: integer
        - name: minResearchScore
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated businesses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessesResponse"

  /businesses/review-queue:
    get:
      operationId: getReviewQueue
      tags: [businesses]
      summary: List businesses that should be manually reviewed next
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Prioritized review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewQueueItem"

  /businesses/{id}:
    get:
      operationId: getBusinessById
      tags: [businesses]
      summary: Get a business by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Business details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/outreach:
    get:
      operationId: getBusinessOutreach
      tags: [businesses]
      summary: Get protected outreach fields for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outreach details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessOutreach"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateBusinessOutreach
      tags: [businesses]
      summary: Update protected outreach fields for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessOutreachRequest"
      responses:
        "200":
          description: Updated outreach details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessOutreach"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/sources:
    get:
      operationId: getBusinessSources
      tags: [businesses]
      summary: List tracked sources for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sources for one business
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessSource"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/contact-candidates:
    get:
      operationId: getBusinessContactCandidates
      tags: [businesses]
      summary: List contact candidates derived for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact candidates for one business
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactCandidate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/outreach-events:
    get:
      operationId: getBusinessOutreachEvents
      tags: [businesses]
      summary: List outreach audit events for one business
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outreach audit event timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /businesses/{id}/contact-candidates/{candidateId}:
    patch:
      operationId: updateBusinessContactCandidate
      tags: [businesses]
      summary: Update review state or primary flag for one contact candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: candidateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCandidateUpdateRequest"
      responses:
        "200":
          description: Updated contact candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCandidate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /research/metrics:
    get:
      operationId: getResearchMetrics
      tags: [research]
      summary: Research metrics for the current filtered target set
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
        - name: engineType
          in: query
          schema:
            type: string
        - name: targetCluster
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Research metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchMetricsResponse"

  /research/feed:
    get:
      operationId: getResearchFeed
      tags: [research]
      summary: Ranked research feed for the current filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
        - name: engineType
          in: query
          schema:
            type: string
        - name: targetCluster
          in: query
          schema:
            type: string
        - name: minPriorityScore
          in: query
          schema:
            type: integer
        - name: minResearchScore
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Research feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchFeedResponse"

  /research/review-buckets:
    get:
      operationId: getResearchReviewBuckets
      tags: [research]
      summary: Review buckets grouped by blocker type
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
        - name: engineType
          in: query
          schema:
            type: string
        - name: targetCluster
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Review buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewBucket"

  /research/jobs:
    get:
      operationId: getResearchJobs
      tags: [research]
      summary: List research jobs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Research jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchJob"
    post:
      operationId: createResearchJob
      tags: [research]
      summary: Enqueue a research job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchJobCreateRequest"
      responses:
        "201":
          description: Research job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchJob"
        "400":
          description: Invalid research job request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /research/jobs/run:
    post:
      operationId: runResearchJobs
      tags: [research]
      summary: Trigger one automation tick for research jobs
      responses:
        "200":
          description: Automation tick completed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /research/views:
    get:
      operationId: getResearchViews
      tags: [research]
      summary: List saved research views
      responses:
        "200":
          description: Saved views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchView"
    post:
      operationId: createResearchView
      tags: [research]
      summary: Create a saved research view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchViewPayload"
      responses:
        "201":
          description: Saved view created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchView"
        "400":
          description: Invalid saved view request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /research/views/{id}:
    patch:
      operationId: updateResearchView
      tags: [research]
      summary: Update a saved research view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchViewPayload"
      responses:
        "200":
          description: Saved view updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchView"
        "404":
          description: Saved view not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteResearchView
      tags: [research]
      summary: Delete a saved research view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Saved view deleted

  /offers:
    get:
      operationId: getOffers
      tags: [slg]
      summary: List SLG offers
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Offer"

  /narratives:
    get:
      operationId: getNarratives
      tags: [slg]
      summary: List SLG narratives
      responses:
        "200":
          description: Narratives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Narrative"

  /credibility-assets:
    get:
      operationId: getCredibilityAssets
      tags: [slg]
      summary: List SLG credibility assets
      responses:
        "200":
          description: Credibility assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredibilityAsset"

  /case-studies:
    get:
      operationId: getCaseStudies
      tags: [slg]
      summary: List SLG case studies
      responses:
        "200":
          description: Case studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseStudy"

  /seasonal-windows:
    get:
      operationId: getSeasonalWindows
      tags: [slg]
      summary: List SLG seasonal windows
      responses:
        "200":
          description: Seasonal windows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeasonalWindow"

  /content-assets:
    get:
      operationId: getContentAssets
      tags: [slg]
      summary: List SLG content assets
      responses:
        "200":
          description: Content assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentAsset"

  /relationship-paths:
    get:
      operationId: getRelationshipPaths
      tags: [slg]
      summary: List relationship paths
      parameters:
        - name: businessId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Relationship paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RelationshipPathSummary"

  /strategic-accounts:
    get:
      operationId: getStrategicAccounts
      tags: [slg]
      summary: List strategic accounts
      parameters:
        - name: businessId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Strategic accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategicAccountSummary"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Dashboard statistics
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

  /outreach/dashboard:
    get:
      operationId: getOutreachDashboard
      tags: [outreach]
      summary: Outreach KPI dashboard metrics
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Outreach dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachDashboardResponse"

  /outreach/pipeline:
    get:
      operationId: getOutreachPipeline
      tags: [outreach]
      summary: Follow-up board items and urgency buckets
      parameters:
        - name: horizonDays
          in: query
          schema:
            type: integer
            default: 7
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Outreach pipeline board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachPipelineResponse"

  /imports/run:
    post:
      operationId: runImport
      tags: [imports]
      summary: Queue an import for a category + city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "202":
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Import failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /imports/runs:
    get:
      operationId: getImportRuns
      tags: [imports]
      summary: List import run history
      responses:
        "200":
          description: Import runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportRun"

  /imports/runs/{id}:
    get:
      operationId: getImportRunById
      tags: [imports]
      summary: Get detailed status for one import run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Import run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /export/businesses.csv:
    get:
      operationId: exportBusinessesCsv
      tags: [export]
      summary: Export businesses as CSV
      parameters:
        - name: categorySlug
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: targetMarket
          in: query
          schema:
            type: string
        - name: readyForOutreach
          in: query
          schema:
            type: boolean
        - name: reviewRequired
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Category:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        label:
          type: string
        description:
          type: ["string", "null"]
        osmTags:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
      required: [id, slug, label, osmTags, active, createdAt]

    Business:
      type: object
      properties:
        id:
          type: integer
        categorySlug:
          type: string
        name:
          type: string
        slug:
          type: string
        latitude:
          type: string
        longitude:
          type: string
        addressLine:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        osmId:
          type: ["string", "null"]
        osmType:
          type: ["string", "null"]
        googlePlaceId:
          type: ["string", "null"]
        googleMapsUrl:
          type: ["string", "null"]
        rating:
          type: ["string", "null"]
        userRatingsTotal:
          type: ["integer", "null"]
        hasWebsite:
          type: boolean
        hasPhone:
          type: boolean
        enrichmentStatus:
          type: string
        targetMarket:
          type: ["string", "null"]
        engineType:
          type: ["string", "null"]
        targetType:
          type: ["string", "null"]
        targetCluster:
          type: ["string", "null"]
        avatarType:
          type: ["string", "null"]
        discoveryStatus:
          type: ["string", "null"]
        qualificationStatus:
          type: ["string", "null"]
        contactabilityStatus:
          type: ["string", "null"]
        rankingStatus:
          type: ["string", "null"]
        sourceHealth:
          type: ["string", "null"]
        contactReadiness:
          type: ["string", "null"]
        relevanceScore:
          type: ["integer", "null"]
        contactabilityScore:
          type: ["integer", "null"]
        confidenceScore:
          type: ["integer", "null"]
        freshnessScore:
          type: ["integer", "null"]
        priorityScore:
          type: ["integer", "null"]
        researchScore:
          type: ["integer", "null"]
        economicValueScore:
          type: ["integer", "null"]
        strategicValueScore:
          type: ["integer", "null"]
        referralValueScore:
          type: ["integer", "null"]
        prestigeValueScore:
          type: ["integer", "null"]
        continuityRevenuePotential:
          type: ["integer", "null"]
        offerFitScore:
          type: ["integer", "null"]
        relationshipPathScore:
          type: ["integer", "null"]
        actionabilityScore:
          type: ["integer", "null"]
        officialSourceCount:
          type: ["integer", "null"]
        successfulSourceCount:
          type: ["integer", "null"]
        failedSourceCount:
          type: ["integer", "null"]
        primarySourceId:
          type: ["integer", "null"]
        primaryContactCandidateId:
          type: ["integer", "null"]
        bestOfferId:
          type: ["integer", "null"]
        bestNarrativeId:
          type: ["integer", "null"]
        secondaryNarrativeId:
          type: ["integer", "null"]
        bestCredibilityAssetId:
          type: ["integer", "null"]
        bestCaseStudyId:
          type: ["integer", "null"]
        proofAngle:
          type: ["string", "null"]
        riskReductionReason:
          type: ["string", "null"]
        toneOfApproach:
          type: ["string", "null"]
        recommendedPitchAngle:
          type: ["string", "null"]
        nextBestContactWindow:
          type: ["string", "null"]
        accountTier:
          type: ["string", "null"]
        seasonalityFit:
          type: ["string", "null"]
        warmPathExists:
          type: boolean
        readyForRelationship:
          type: boolean
        readyForInstitutionalPitch:
          type: boolean
        prestigeWatchlist:
          type: boolean
        cultivationRequired:
          type: boolean
        readyForOutreach:
          type: boolean
        reviewRequired:
          type: boolean
        reviewReason:
          type: ["string", "null"]
        topGap:
          type: ["string", "null"]
        recommendedNextStep:
          type: ["string", "null"]
        lastResearchAt:
          type: ["string", "null"]
        nextResearchAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - categorySlug
        - name
        - slug
        - latitude
        - longitude
        - hasWebsite
        - hasPhone
        - enrichmentStatus
        - warmPathExists
        - readyForRelationship
        - readyForInstitutionalPitch
        - prestigeWatchlist
        - cultivationRequired
        - readyForOutreach
        - reviewRequired
        - createdAt
        - updatedAt

    BusinessesResponse:
      type: object
      properties:
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/Business"
        total:
          type: integer
        page:
          type: integer
